<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14123a"/><stop offset="0.55" stop-color="#4c1d95"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.07"/></pattern>
<linearGradient id="scan" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#c4b5fd" stop-opacity="0"/><stop offset="1" stop-color="#c4b5fd" stop-opacity="0.22"/></linearGradient>
<clipPath id="r"><rect width="1000" height="280" rx="18"/></clipPath>
</defs>
<g clip-path="url(#r)">
<rect width="1000" height="280" fill="url(#bg)"/>
<rect width="1000" height="280" fill="url(#grid)"/>
<circle cx="900" cy="30" r="120" fill="#a78bfa" opacity="0.18"><animate attributeName="r" values="110;145;110" dur="6s" repeatCount="indefinite"/></circle>
<circle cx="90" cy="270" r="100" fill="#22d3ee" opacity="0.10"><animate attributeName="r" values="90;120;90" dur="7s" repeatCount="indefinite"/></circle>
<rect width="1000" height="70" fill="url(#scan)"><animate attributeName="y" values="-70;280" dur="5s" repeatCount="indefinite"/></rect>
</g>
<text x="500" y="122" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="70" font-weight="800" fill="#ffffff">Osama Mattar</text>
<text x="500" y="165" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Courier New',monospace" font-size="18" fill="#ddd6fe">&gt; Backend Developer · ASP.NET Core · Clean Architecture</text>
<text x="500" y="198" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Courier New',monospace" font-size="14" fill="#c4b5fd" opacity="0.9">[ building secure, multi-tenant .NET systems ]</text>
<rect x="415" y="222" width="170" height="30" rx="15" fill="#0A0A1A" fill-opacity="0.65" stroke="#34d399" stroke-opacity="0.8"/>
<circle cx="440" cy="237" r="5" fill="#34d399"><animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/></circle>
<text x="455" y="242" font-family="'SFMono-Regular',Consolas,'Courier New',monospace" font-size="12" letter-spacing="1.5" fill="#a7f3d0">OPEN TO WORK</text>
